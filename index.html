<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14223f">
<title>Tokébac Icitte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Le drapeau Carillon-Sacré-Cœur au centre, comme un étendard; le nom dessous, sur fond de nuit bleue. */
:root{--nuit:#14223f;--nuit2:#0c1528;--blanc:#f4efe2;--or:#e6b93a;--bleu:#4f78c4;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 35%,#1f3360,var(--nuit) 55%,var(--nuit2));color:var(--blanc);display:flex;align-items:center;justify-content:center;padding:24px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;min-height:100%}
main{display:flex;flex-direction:column;align-items:center;gap:clamp(18px,3.5vh,34px);width:100%;max-width:980px}
figure{margin:0;width:min(100%,calc(62vh * 1.244));animation:lever 1.4s cubic-bezier(.2,.8,.2,1) both}
figure img{display:block;width:100%;height:auto;border-radius:3px;box-shadow:0 0 0 1px rgba(230,185,58,.5),0 30px 80px -20px rgba(0,0,0,.7),0 0 120px -30px rgba(230,185,58,.35)}
.titre{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;animation:lever 1.4s .35s cubic-bezier(.2,.8,.2,1) both}
h1{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-weight:800;font-size:clamp(2.4rem,8vmin,5.5rem);line-height:.95;letter-spacing:-.03em;margin:0}
h1 span{color:var(--or)}
p{margin:0;font-size:clamp(.7rem,1.8vmin,.92rem);letter-spacing:.22em;text-transform:uppercase;color:var(--or);display:flex;align-items:center;gap:12px;white-space:nowrap}
p::before,p::after{content:"";width:28px;height:1px;background:currentColor;opacity:.7}
@keyframes lever{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){figure,.titre{animation:none}}
</style>
</head>
<body>
<main>
  <figure><img src="carillon.jpg" width="1024" height="823" alt="Le drapeau Carillon-Sacré-Cœur : croix blanche sur fond bleu, quatre fleurs de lys blanches pointant vers le centre, Sacré-Cœur entouré de feuilles d'érable, bordure dorée"></figure>
  <div class="titre">
    <h1>Tokébac Icitte<span>.</span></h1>
    <p>Site sous construction</p>
  </div>
</main>
</body>
</html>
