<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1430">
<title>Tokébac Icitte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Cormorant+SC:wght@500;600&display=swap">
<style>
/* Le drapeau Carillon-Sacré-Cœur se fond dans le ciel du fjord du Saguenay au crépuscule et se reflète dans l'eau; le nom gravé en capitales classiques au-dessus de l'eau. */
:root{--nuit:#0b1430;--ivoire:#efe6d2;--or:#d9b45a;--or-pale:#e9d39a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--nuit);color:var(--ivoire);font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;overflow-x:hidden}
canvas#fjord{position:fixed;inset:0;width:100%;height:100%;display:block}
.voile{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 30%,rgba(5,9,22,.4) 90%);pointer-events:none}
main{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(20px,4vh,40px);padding:32px 20px max(9vh,48px)}
.titre{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;animation:lever 1.8s .5s cubic-bezier(.2,.8,.2,1) both;text-shadow:0 2px 18px rgba(0,0,0,.8)}
.orn{display:flex;align-items:center;gap:14px;color:var(--or)}
.orn::before,.orn::after{content:"";width:clamp(40px,10vw,110px);height:1px;background:linear-gradient(90deg,transparent,var(--or))}
.orn::after{background:linear-gradient(90deg,var(--or),transparent)}
.orn span{font-size:.9rem;letter-spacing:.3em}
h1{font-family:"Cormorant SC","Cormorant Garamond",Garamond,serif;font-weight:600;font-size:clamp(2.6rem,8.4vmin,5.8rem);line-height:1;letter-spacing:.06em;margin:0;color:var(--ivoire)}
.devise{font-style:italic;font-weight:500;font-size:clamp(1.05rem,2.4vmin,1.4rem);color:var(--or-pale);margin:0;letter-spacing:.02em}
.etat{font-family:"Cormorant SC",Garamond,serif;font-size:clamp(.85rem,1.9vmin,1.05rem);letter-spacing:.32em;color:var(--or);margin:0}
@keyframes lever{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.titre{animation:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<canvas id="fjord" aria-hidden="true"></canvas>
<div class="voile" aria-hidden="true"></div>
<main>
  <p class="sr">Le drapeau Carillon-Sacré-Cœur se lève dans le ciel du fjord du Saguenay, au crépuscule.</p>
  <div class="titre">
    <div class="orn" aria-hidden="true"><span>✦</span></div>
    <h1>Tokébac Icitte</h1>
    <p class="devise">Je me souviens</p>
    <p class="etat">Site en construction</p>
  </div>
</main>
<script>
/* Fjord du Saguenay au crépuscule : falaises qui se resserrent vers l'horizon, épinettes sur les crêtes, eau sombre et reflets. */
(function(){
  const cv = document.getElementById('fjord'), ctx = cv.getContext('2d');
  const flag = new Image(); flag.src = 'carillon.jpg';
  function rng(seed){ return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }
  function mix(a, b, t){ const p = x => [1,3,5].map(i => parseInt(x.substr(i,2),16)); const A = p(a), B = p(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
  function draw(){
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const hz = H * 0.6, R = rng(1608);

    // Ciel
    let g = ctx.createLinearGradient(0,0,0,hz);
    g.addColorStop(0,'#070d22'); g.addColorStop(.45,'#16254b'); g.addColorStop(.8,'#4a4a62'); g.addColorStop(1,'#b08a5a');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,hz);
    const glow = ctx.createRadialGradient(W*.5,hz,0,W*.5,hz,W*.45);
    glow.addColorStop(0,'rgba(236,190,120,.55)'); glow.addColorStop(1,'rgba(236,190,120,0)');
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,hz);
    for (let i = 0; i < 140; i++){ const x = R()*W, y = R()*hz*.5, a = R()*.6; ctx.fillStyle = `rgba(255,248,230,${a*(1-y/(hz*.5))})`; ctx.fillRect(x,y,R()<.1?1.6:1,R()<.1?1.6:1); }

    // Le drapeau, fondu dans le ciel entre les falaises
    if (flag.complete && flag.naturalWidth){
      const fw = Math.min(W*.62, hz*.95*1.244), fh = fw/1.244, fx = (W-fw)/2, fy = Math.max(H*.04, hz*.5 - fh*.55);
      const off = document.createElement('canvas'); off.width = Math.round(fw*dpr); off.height = Math.round(fh*dpr);
      const o = off.getContext('2d'); o.scale(dpr,dpr);
      o.drawImage(flag, 0, 0, fw, fh);
      o.globalCompositeOperation = 'destination-in';
      const gx = o.createLinearGradient(0,0,fw,0);
      gx.addColorStop(0,'rgba(0,0,0,0)'); gx.addColorStop(.1,'rgba(0,0,0,1)'); gx.addColorStop(.9,'rgba(0,0,0,1)'); gx.addColorStop(1,'rgba(0,0,0,0)');
      o.fillStyle = gx; o.fillRect(0,0,fw,fh);
      const gy = o.createLinearGradient(0,0,0,fh);
      gy.addColorStop(0,'rgba(0,0,0,0)'); gy.addColorStop(.12,'rgba(0,0,0,1)'); gy.addColorStop(.82,'rgba(0,0,0,1)'); gy.addColorStop(1,'rgba(0,0,0,0)');
      o.fillStyle = gy; o.fillRect(0,0,fw,fh);
      o.globalCompositeOperation = 'source-atop';
      const tint = o.createLinearGradient(0,0,0,fh);
      tint.addColorStop(0,'rgba(10,18,45,.35)'); tint.addColorStop(1,'rgba(236,190,120,.18)');
      o.fillStyle = tint; o.fillRect(0,0,fw,fh);
      ctx.save(); ctx.globalAlpha = .82; ctx.drawImage(off, fx, fy, fw, fh); ctx.restore();
    }

    // Couches de falaises : de la plus lointaine à la plus proche
    const layers = [
      { inner:.47, top:.50, col:mix('#2b3656','#b08a5a',.35), trees:3 },
      { inner:.43, top:.42, col:'#2a3a62', trees:5 },
      { inner:.38, top:.33, col:'#1c2a4c', trees:8 },
      { inner:.30, top:.20, col:'#121d38', trees:12 },
      { inner:.20, top:.08, col:'#0a1226', trees:18 }
    ];
    function ridge(side, L){
      // points de la crête, du bord de l'écran vers le centre
      const pts = [], x0 = side < 0 ? 0 : W, x1 = side < 0 ? W*L.inner : W*(1-L.inner), n = 60;
      const yTop = H*L.top, rr = rng(side < 0 ? 77 + L.inner*1000 : 991 + L.inner*1000);
      let jitter = 0;
      for (let i = 0; i <= n; i++){
        const t = i/n, x = x0 + (x1-x0)*t;
        const shape = Math.pow(t, 1.8);                    // plateau puis chute vers l'eau
        jitter += (rr()-.5)*H*.012; jitter *= .85;
        const y = yTop + (hz - yTop) * shape + jitter + Math.sin(t*9 + L.inner*20)*H*.01;
        pts.push([x, Math.min(y, hz)]);
      }
      return pts;
    }
    function cliff(side, L, mirror){
      const pts = ridge(side, L);
      ctx.beginPath();
      ctx.moveTo(side < 0 ? 0 : W, hz);
      pts.forEach(([x,y]) => ctx.lineTo(x, y));
      ctx.lineTo(pts[pts.length-1][0], hz);
      ctx.closePath(); ctx.fillStyle = L.col; ctx.fill();
      // épinettes sur la crête
      const rr = rng(side < 0 ? 5 + L.trees : 55 + L.trees);
      ctx.fillStyle = L.col;
      for (let i = 0; i < pts.length - 1; i++){
        const [xa,ya] = pts[i], [xb,yb] = pts[i+1];
        const steps = Math.max(1, Math.round(Math.abs(xb-xa) / (L.trees*.55)));
        for (let s = 0; s < steps; s++){
          const t = s/steps, x = xa+(xb-xa)*t, y = ya+(yb-ya)*t;
          if (y > hz - 2) continue;
          const h = L.trees * (0.6 + rr()*0.9), w = h*0.32;
          ctx.beginPath(); ctx.moveTo(x-w, y+1); ctx.lineTo(x, y-h); ctx.lineTo(x+w, y+1); ctx.fill();
        }
      }
    }
    layers.forEach(L => { cliff(-1, L); cliff(1, L); });

    // Eau : reflet inversé des falaises, puis profondeur
    ctx.save();
    ctx.translate(0, hz*2); ctx.scale(1,-1);
    ctx.beginPath(); ctx.rect(0, hz - (H-hz), W, H-hz); ctx.clip();
    ctx.globalAlpha = .55;
    ctx.drawImage(cv, 0, 0, W*dpr, hz*dpr, 0, 0, W, hz);
    ctx.restore();
    g = ctx.createLinearGradient(0,hz,0,H);
    g.addColorStop(0,'rgba(20,32,62,.35)'); g.addColorStop(.25,'rgba(10,18,38,.75)'); g.addColorStop(1,'rgba(4,8,18,.96)');
    ctx.fillStyle = g; ctx.fillRect(0,hz,W,H-hz);
    // reflet de la lumière sur l'eau
    for (let i = 0; i < 46; i++){
      const y = hz + 3 + Math.pow(i/46,1.6)*(H-hz)*.8, w = (W*.16)*(1 - i/60)*(0.5+R()*.8);
      ctx.fillStyle = `rgba(236,196,130,${.32*(1-i/46)})`;
      ctx.fillRect(W*.5 - w/2 + (R()-.5)*20, y, w, 1 + i/30);
    }
    // brume sur l'eau
    const mist = ctx.createLinearGradient(0, hz - H*.06, 0, hz + H*.05);
    mist.addColorStop(0,'rgba(220,210,200,0)'); mist.addColorStop(.5,'rgba(220,210,200,.16)'); mist.addColorStop(1,'rgba(220,210,200,0)');
    ctx.fillStyle = mist; ctx.fillRect(0, hz - H*.06, W, H*.11);
    // grain léger
    for (let i = 0; i < (W*H)/900; i++){ ctx.fillStyle = `rgba(255,255,255,${R()*.035})`; ctx.fillRect(R()*W, R()*H, 1, 1); }
  }
  let t; draw(); flag.onload = draw; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(draw, 150); });
})();
</script>
</body>
</html>
