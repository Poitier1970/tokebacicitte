<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tokébac Icitte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#f1f2ee;--ink:#14192a;--muted:#5b6173;--accent:#1f45c4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10131c;--ink:#e7e8ee;--muted:#9ca1b2;--accent:#90a9ff;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;padding:24px;font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
main{display:flex;flex-direction:column;gap:20px;max-width:900px;width:100%}
h1{font-family:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;font-weight:800;font-size:clamp(3rem,13vw,8.5rem);line-height:.9;letter-spacing:-.03em;margin:0}
h1 span{color:var(--accent)}
p{margin:0;font-size:clamp(.85rem,2.4vw,1rem);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
p::before{content:"";width:40px;height:2px;background:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>Tokébac<br>Icitte<span>.</span></h1>
  <p>Site sous construction</p>
</main>
</body>
</html>
